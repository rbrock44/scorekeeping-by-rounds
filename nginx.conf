server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The app uses client-side routing (/rankings, /score-entry, /bonus-round,
  # /settings), so unknown paths must fall back to index.html rather than 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
